{% load static %}
<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle Social</title>
<link rel="stylesheet" href="{% static 'style.css' %}">
<script defer src="{% static 'app.js' %}"></script>
</head><body>
<header><a class="logo" href="/">circle.</a><nav>
<a href="/">Feed</a>
{% if user.is_authenticated %}
<a href="{% url 'profile' user.username %}">My profile</a>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}
<button class="navbutton">Logout</button></form>
{% else %}
<a href="/login/">Login</a><a class="join" href="/register/">Register</a>
{% endif %}
</nav></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer>Circle · Mini Social Media Platform</footer>
</body></html>
